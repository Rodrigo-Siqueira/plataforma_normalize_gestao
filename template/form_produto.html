<div class="w3-container w3-padding  w3-margin-bottom">
    <div class="w3-container w3-padding  w3-margin-bottom">
        <h3>Formulário de Produto</h3>
    </div>

    <div class="w3-card w3-white w3-padding w3-margin-top w3-round" style="max-width:750px; margin:auto;">
        <form enctype="multipart/form-data" method="post" action="prod_form.php?action=save" class="w3-container">

            <div class="w3-row-padding w3-margin-top">
                <!-- Código -->
                <div class="w3-quarter">
                    <label>Código</label>
                    <span class="w3-text-red">{ERRO_ID}</span>
                    <input name="id" readonly type="text" value="{id}" class="w3-input w3-border w3-sand w3-round">
                </div>

                <div class="w3-threequarter">
                    <!-- Ativo -->
                    <label>Ativo</label>
                    <span class="w3-text-red">{ERRO_ATIVO}</span>
                    <select name="ativo" class="w3-select w3-border w3-round" required>
                        {ativo}
                    </select>
                </div>
            </div>

            <div class="w3-row-padding w3-margin-top">
                <div class="w3-col">
                    <!-- Nome -->
                    <label>Nome</label>
                    <span class="w3-text-red">{ERRO_NOME}</span>
                    <input name="nome" type="text" value="{nome}" class="w3-input w3-border w3-round" required>
                </div>
            </div>

            <div class="w3-row-padding w3-margin-top">
                <div class="w3-half">
                    <!-- Tipo -->
                    <label>Tipo</label>
                    <span class="w3-text-red">{ERRO_TIPO}</span>
                    <select name="tipo" class="w3-select w3-border w3-round" required>
                        {tipo}
                    </select>
                </div>

                <div class="w3-half">
                    <!-- Quantidade de Sessões -->
                    <label>Quantidade de Sessões</label>
                    <span class="w3-text-red">{ERRO_SESSOES}</span>
                    <input name="sessoes" type="number" value="{qtdsessoes}" min="1" class="w3-input w3-border w3-round"
                        required>
                </div>
            </div>

            <div class="w3-row-padding w3-margin-top">
                <div class="w3-half">
                    <!-- Preço -->
                    <label>Preço</label>
                    <span class="w3-text-red">{ERRO_PRECO}</span>
                    <input name="preco" type="number" value="{preco}" min="0" step="0.01"
                        class="w3-input w3-border w3-round" required>
                </div>

                <div class="w3-half">
                    <!-- Validade -->
                    <label>Validade</label>
                    <span class="w3-text-red">{ERRO_VALIDADE}</span>                    
                    <input name="validade" type="number" value="{validade}" min="30" max="90"
                        class="w3-input w3-border w3-round" required>
                </div>
            </div>

            <div class="w3-row-padding w3-margin-top">
                <div class="w3-col">
                    <!-- Botões -->
                    <button type="submit" class="w3-button w3-green w3-round w3-margin-bottom w3-margin-right">
                        <span class="material-symbols-outlined">save</span>
                        <b>Salvar</b>
                    </button>
                    <button type="reset" class="w3-button w3-red w3-round w3-margin-bottom w3-margin-right">
                        <span class="material-symbols-outlined">cancel</span>
                        <b>Cancelar</b>
                    </button>
                </div>
            </div>

        </form>
    </div>
</div>
