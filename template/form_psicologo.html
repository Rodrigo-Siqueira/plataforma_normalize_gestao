<div class="w3-container w3-padding  w3-margin-bottom">
    <div class="w3-container w3-padding  w3-margin-bottom">
        <h3>Cadastro de Psicólogo</h3>
    </div>
    <div class="w3-card w3-white w3-padding w3-margin-top w3-round" style="max-width:650px; margin:auto;">
        <form id="formPsicologo" enctype="multipart/form-data" method="post" action="psicologo_form.php?action=save" class="w3-container">

            <div class="w3-row-padding w3-margin-top">
                <div class="w3-third">
                    <!-- Código -->
                    <label>Código</label>
                    <input name="id" readonly type="text" value="{ID}"
                        class="w3-input w3-border w3-sand w3-round">
                    <span class="w3-text-red erro">{ERRO_ID}</span>
                    <input type="hidden" name="pessoa_id" value="{PESSOA_ID}">
                    <span class="w3-text-red erro">{ERRO_PESSOA_ID}</span>
                </div>

                <div class=" w3-third w3-right">
                    <!-- Ativo -->
                    <label>Ativo</label>
                    <select name="ativo" class="w3-select w3-border w3-round" required>
                        {ATIVO}
                    </select>
                    <span class="w3-text-red erro">{ERRO_ATIVO}</span>
                </div>
            </div>

            <div class="w3-row-padding w3-margin-top">
                <div class="w3-col">
                    <!-- Nome Completo -->
                    <label>Nome Completo</label>
                    <input name="nome" type="text" value="{NOME}" class="w3-input w3-border w3-round"
                        required>
                    <span class="w3-text-red erro">{ERRO_NOME}</span>
                </div>
            </div>

            <div class="w3-row-padding w3-margin-top">
                
                <!-- Código -->
                <div class="w3-half">
                    <!-- CRP -->
                    <label>Nº CRP</label>               
                    <input name="crp" type="text" value="{CRP}" class="w3-input w3-border w3-round"
                        required>
                    <span class="w3-text-red erro">{ERRO_CRP}</span>
                </div>

                <div class="w3-half">
                    <!-- Contato -->
                    <label>Contato</label>
                    <input name="contato" type="tel" value="{CONTATO}"
                        class="w3-input w3-border w3-round" required>
                    <span class="w3-text-red erro">{ERRO_CONTATO}</span>
                </div>
            </div>

            <div class="w3-row-padding w3-margin-top">
                <div class="w3-half">
                    <!-- Repasse -->
                    <label>(%) Repasse</label>
                    <input name="comissao" type="number" value="{COMISSAO}" step="0.01"
                        class="w3-input w3-border w3-round" required>
                    <span class="w3-text-red erro">{ERRO_COMISSAO}</span>
                </div>

                <div class="w3-half">
                    <!-- Data de Inicio -->
                    <label>Data de Inicio</label>
                    <input name="data_inicio" type="date" value="{DATA_INICIO}"
                        class="w3-input w3-border w3-round" required>
                    <span class="w3-text-red">{ERRO_DATA_INICIO}</span>
                </div>
            </div>

            <div class="w3-row-padding w3-margin-top">
                <div class="w3-col">
                    <!-- Botões -->
                    <button type="submit" class="w3-button w3-green w3-round w3-margin-bottom w3-margin-right">
                        <span class="material-symbols-outlined">save</span>
                        <b>Salvar</b>
                    </button>
                    <button type="reset" class="w3-button w3-red w3-round w3-margin-bottom w3-margin-right">
                        <span class="material-symbols-outlined">cancel</span>
                        <b>Cancelar</b>
                    </button>
                </div>
            </div>

        </form>
    </div>
</div>
